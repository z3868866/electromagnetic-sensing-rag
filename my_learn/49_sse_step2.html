<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SSE场景二</title></head>
<body>
  <h3>输入会话ID，接收专属消息</h3>
  <input type="text" id="sessionIdInput" placeholder="输入会话ID（如123）" value="123">
  <button onclick="connectSSE()">连接SSE</button>
  <div id="result"></div>
  <script>
    let eventSource = null;
    function connectSSE() {
      if (eventSource) {
        eventSource.close();        // 先关闭旧连接，停止接收与自动重连
      }
      const sessionId = document.getElementById("sessionIdInput").value;
      document.getElementById("result").innerHTML = "";
      eventSource = new EventSource(`http://127.0.0.1:8001/stream/${sessionId}`);
      eventSource.onmessage = function (event) {
        document.getElementById("result").innerHTML += event.data + "<br>";
      };
    }
  </script>
</body>
</html>
